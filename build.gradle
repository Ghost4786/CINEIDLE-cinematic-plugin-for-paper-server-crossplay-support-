plugins {
    id 'java'
}

group = 'com.solt'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://repo.dmulloy2.net/repository/public/" }
    maven { url = "https://repo.opencollab.dev/main/" }
}

dependencies {
    // Valid Paper API coordinates for 1.21.x
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"
    
    // ProtocolLib 5.3.0 for safe packet wrapper integration
    compileOnly "com.comphenix.protocol:ProtocolLib:5.3.0"
    
    // Valid Geyser API & Floodgate API coordinates for latest Bedrock integration
    compileOnly "org.geysermc.floodgate:api:2.2.2-SNAPSHOT"
    compileOnly "org.geysermc.geyser:api:2.4.2-SNAPSHOT"
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

task dumpMethods {
    doLast {
        def cp = configurations.compileClasspath
        URLClassLoader loader = new URLClassLoader(cp.files.collect { it.toURI().toURL() } as URL[])
        def clazz = loader.loadClass("org.geysermc.geyser.api.bedrock.camera.CameraPosition`$Builder")
        clazz.methods.each { println it }
        def clazz2 = loader.loadClass("com.comphenix.protocol.wrappers.PlayerInfoData")
        clazz2.constructors.each { println it }
    }
}

